<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM-Empire Web Studio - Alight Motion Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        canvas { touch-action: none; background: #000; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- LANDING PAGE -->
    <div id="landing" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-2xl bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-xl">
            <div class="w-20 h-20 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl font-black shadow-lg">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight text-amber-400 mb-3">AM-EMPIRE WEB STUDIO</h1>
            <p class="text-slate-400 text-lg mb-8">Professional Motion Graphics, Keyframe Animation, and WebM Video Export directly in your browser.</p>
            <button id="btnStart" onclick="document.getElementById('landing').classList.add('hidden'); document.getElementById('editor').classList.remove('hidden'); initEditor();" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-extxl font-bold px-8 py-4 rounded-2xl shadow-lg transition transform hover:scale-105">
                Launch Studio <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- EDITOR (Initially Hidden) -->
    <div id="editor" class="hidden flex-1 flex flex-col h-screen">
        <!-- Top Navigation -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-amber-400 text-slate-950 rounded-xl flex items-center justify-center font-black">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-slate-100">AM-Empire Project #1</h2>
                    <span class="text-xs text-amber-400">720 x 1280 (9:16 Vertical)</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="togglePlay()" id="playBtn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-4 py-2 rounded-xl font-semibold flex items-center space-x-2 border border-slate-700">
                    <i id="playIcon" class="fa-solid fa-play"></i> <span id="playText">Play</span>
                </button>
                <button onclick="addKeyframe()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-xl font-semibold flex items-center space-x-2 shadow-md">
                    <i class="fa-solid fa-key"></i> <span>+ Keyframe</span>
                </button>
                <button onclick="exportVideo()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 py-2 rounded-xl font-bold flex items-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-download"></i> <span id="exportText">Export WebM</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Left Toolbar: Add Elements -->
            <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Add Layers</h3>
                <button onclick="addElement('rect')" class="w-full bg-slate-800 hover:bg-slate-700 text-left px-4 py-3 rounded-xl flex items-center space-x-3 border border-slate-700/50">
                    <i class="fa-solid fa-square text-amber-400"></i> <span class="font-medium">Rectangle</span>
                </button>
                <button onclick="addElement('circle')" class="w-full bg-slate-800 hover:bg-slate-700 text-left px-4 py-3 rounded-xl flex items-center space-x-3 border border-slate-700/50">
                    <i class="fa-solid fa-circle text-purple-400"></i> <span class="font-medium">Circle</span>
                </button>
                <button onclick="addElement('text')" class="w-full bg-slate-800 hover:bg-slate-700 text-left px-4 py-3 rounded-xl flex items-center space-x-3 border border-slate-700/50">
                    <i class="fa-solid fa-font text-pink-400"></i> <span class="font-medium">Text</span>
                </button>

                <hr class="border-slate-800 my-2">

                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Layers List</h3>
                <div id="layersList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <!-- Dynamic layers inserted here -->
                </div>
            </aside>

            <!-- Center Canvas Area -->
            <main class="flex-1 bg-slate-950 flex items-center justify-center p-6 relative">
                <div class="relative border-4 border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                    <canvas id="c" width="720" height="1280" class="w-[360px] h-[640px] cursor-crosshair"></canvas>
                </div>
            </main>

            <!-- Right Inspector -->
            <aside class="w-72 bg-slate-900 border-l border-slate-800 p-4 flex flex-col space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Property Inspector</h3>
                <div id="inspector" class="space-y-4 text-sm text-slate-300">
                    <p class="text-slate-500 italic">Select an element on canvas to edit properties.</p>
                </div>
            </aside>
        </div>

        <!-- Bottom Timeline -->
        <footer class="bg-slate-900 border-t border-slate-800 p-4 flex flex-col space-y-2">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span id="currentTimeDisplay">0.0s / 5.0s</span>
                <span class="font-mono text-amber-400">Timeline FPS: 30</span>
            </div>
            <input type="range" id="timeline" min="0" max="150" value="0" class="w-full accent-amber-400 cursor-pointer h-2 bg-slate-800 rounded-lg">
        </footer>
    </div>

    <script>
        let canvas, ctx;
        let elements = [];
        let selectedElement = null;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let currentTime = 0;
        let maxFrames = 150; // 5 seconds at 30fps
        let currentFrame = 0;
        let isPlaying = false;
        let animInterval = null;

        function initEditor() {
            canvas = document.getElementById('c');
            ctx = canvas.getContext('2d');

            // Add default elements
            elements.push({
                id: 1, type: 'rect', x: 260, y: 500, width: 200, height: 200, color: '#f5c518', text: '',
                keyframes: { 0: { x: 260, y: 500 }, 75: { x: 260, y: 300 }, 150: { x: 260, y: 500 } }
            });
            elements.push({
                id: 2, type: 'text', x: 180, y: 800, width: 360, height: 80, color: '#8a2be2', text: 'AM-EMPIRE',
                keyframes: { 0: { x: 180, y: 800 }, 75: { x: 180, y: 850 }, 150: { x: 180, y: 800 } }
            });

            setupCanvasEvents();
            setupTimelineEvents();
            renderCanvas();
            updateLayersUI();
            updateInspector();
        }

        function addElement(type) {
            const id = Date.now();
            const newEl = {
                id, type,
                x: 260, y: 540,
                width: type === 'circle' ? 120 : 200,
                height: type === 'circle' ? 120 : 200,
                color: type === 'text' ? '#ff007f' : (type === 'rect' ? '#f5c518' : '#8a2be2'),
                text: type === 'text' ? 'New Text' : '',
                keyframes: { [currentFrame]: { x: 260, y: 540 } }
            };
            elements.push(newEl);
            selectedElement = newEl;
            renderCanvas();
            updateLayersUI();
            updateInspector();
        }

        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                // Check click on elements (reverse order for top-most)
                selectedElement = null;
                for (let i = elements.length - 1; i >= 0; i--) {
                    const el = elements[i];
                    const pos = getInterpolatedPosition(el, currentFrame);
                    if (mouseX >= pos.x && mouseX <= pos.x + el.width && mouseY >= pos.y && mouseY <= pos.y + el.height) {
                        selectedElement = el;
                        isDragging = true;
                        dragOffsetX = mouseX - pos.x;
                        dragOffsetY = mouseY - pos.y;
                        break;
                    }
                }
                renderCanvas();
                updateLayersUI();
                updateInspector();
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging || !selectedElement) return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                const newX = mouseX - dragOffsetX;
                const newY = mouseY - dragOffsetY;

                selectedElement.keyframes[currentFrame] = { x: newX, y: newY };
                renderCanvas();
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
        }

        function getInterpolatedPosition(el, frame) {
            const kfFrames = Object.keys(el.keyframes).map(Number).sort((a, b) => a - b);
            if (kfFrames.includes(frame)) {
                return el.keyframes[frame];
            }
            // Find surrounding keyframes
            let prev = kfFrames[0], next = kfFrames[kfFrames.length - 1];
            for (let f of kfFrames) {
                if (f <= frame) prev = f;
                if (f >= frame) { next = f; break; }
            }
            if (prev === next) return el.keyframes[prev];
            const p1 = el.keyframes[prev];
            const p2 = el.keyframes[next];
            const t = (frame - prev) / (next - prev);
            return {
                x: p1.x + (p2.x - p1.x) * t,
                y: p1.y + (p2.y - p1.y) * t
            };
        }

        function renderCanvas() {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            elements.forEach(el => {
                const pos = getInterpolatedPosition(el, currentFrame);
                ctx.save();
                ctx.fillStyle = el.color;
                ctx.strokeStyle = el === selectedElement ? '#f5c518' : 'transparent';
                ctx.lineWidth = 4;

                if (el.type === 'rect') {
                    ctx.fillRect(pos.x, pos.y, el.width, el.height);
                    if (el === selectedElement) ctx.strokeRect(pos.x, pos.y, el.width, el.height);
                } else if (el.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(pos.x + el.width / 2, pos.y + el.height / 2, el.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    if (el === selectedElement) ctx.stroke();
                } else if (el.type === 'text') {
                    ctx.font = 'bold 48px sans-serif';
                    ctx.fillStyle = el.color;
                    ctx.fillText(el.text, pos.x, pos.y + 40);
                    if (el === selectedElement) {
                        ctx.strokeRect(pos.x, pos.y, ctx.measureText(el.text).width, 50);
                    }
                }
                ctx.restore();
            });
        }

        function setupTimelineEvents() {
            const slider = document.getElementById('timeline');
            slider.addEventListener('input', (e) => {
                currentFrame = parseInt(e.target.value);
                currentTime = (currentFrame / 30).toFixed(1);
                document.getElementById('currentTimeDisplay').innerText = `${currentTime}s / 5.0s`;
                renderCanvas();
            });
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('playIcon');
            const text = document.getElementById('playText');
            if (isPlaying) {
                icon.className = "fa-solid fa-pause";
                text.innerText = "Pause";
                animInterval = setInterval(() => {
                    currentFrame = (currentFrame + 1) % maxFrames;
                    document.getElementById('timeline').value = currentFrame;
                    currentTime = (currentFrame / 30).toFixed(1);
                    document.getElementById('currentTimeDisplay').innerText = `${currentTime}s / 5.0s`;
                    renderCanvas();
                }, 1000 / 30);
            } else {
                icon.className = "fa-solid fa-play";
                text.innerText = "Play";
                clearInterval(animInterval);
            }
        }

        function addKeyframe() {
            if (!selectedElement) return;
            const pos = getInterpolatedPosition(selectedElement, currentFrame);
            selectedElement.keyframes[currentFrame] = { x: pos.x, y: pos.y };
            alert(`Keyframe added at frame ${currentFrame} (${(currentFrame/30).toFixed(1)}s)!`);
        }

        function updateLayersUI() {
            const list = document.getElementById('layersList');
            list.innerHTML = '';
            elements.forEach(el => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl flex items-center justify-between cursor-pointer border ${el === selectedElement ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-800 border-slate-700/50 text-slate-300 hover:bg-slate-750'}`;
                item.innerHTML = `<span class="font-medium capitalize"><i class="fa-solid fa-layer-group mr-2"></i>${el.type} (${el.id})</span>`;
                item.onclick = () => { selectedElement = el; renderCanvas(); updateLayersUI(); updateInspector(); };
                list.appendChild(item);
            });
        }

        function updateInspector() {
            const ins = document.getElementById('inspector');
            if (!selectedElement) {
                ins.innerHTML = `<p class="text-slate-500 italic">Select an element on canvas to edit properties.</p>`;
                return;
            }
            ins.innerHTML = `
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400">Element Type</label>
                        <p class="font-bold text-amber-400 capitalize">${selectedElement.type}</p>
                    </div>
                    ${selectedElement.type === 'text' ? `
                    <div>
                        <label class="text-xs text-slate-400">Text Content</label>
                        <input type="text" value="${selectedElement.text}" oninput="selectedElement.text = this.value; renderCanvas();" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white">
                    </div>` : ''}
                    <div>
                        <label class="text-xs text-slate-400">Color</label>
                        <input type="color" value="${selectedElement.color}" onchange="selectedElement.color = this.value; renderCanvas();" class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer">
                    </div>
                </div>
            `;
        }

        function exportVideo() {
            const btn = document.getElementById('exportText');
            btn.innerText = "Recording...";
            const stream = canvas.captureStream(30);
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                recorder = new MediaRecorder(stream);
            }
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'am-empire-project.webm';
                a.click();
                btn.innerText = "Export WebM";
                alert('WebM Video successfully exported and downloaded!');
            };

            // Play through 1 cycle to record
            currentFrame = 0;
            document.getElementById('timeline').value = 0;
            renderCanvas();
            recorder.start();

            let recFrame = 0;
            const recInterval = setInterval(() => {
                recFrame++;
                currentFrame = recFrame % maxFrames;
                document.getElementById('timeline').value = currentFrame;
                renderCanvas();
                if (recFrame >= maxFrames) {
                    clearInterval(recInterval);
                    recorder.stop();
                }
            }, 1000 / 30);
        }
    </script>
</body>
</html>
